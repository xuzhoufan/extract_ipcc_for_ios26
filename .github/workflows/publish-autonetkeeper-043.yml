name: Public AutoNetKeeper 0.4.3 RootHide download
on:
  push:
    branches: ['downloads/autonetkeeper-043']
    paths: ['.github/workflows/publish-autonetkeeper-043.yml']
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch compiled package and verify checksum
        env:
          PACKAGE_URL: "https://sdmntprcentralindia.oaiusercontent.com/files/00000000-5cac-8208-be2c-20fd714803ad/raw?se=2026-11-04T21%3A39%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=daad7dab-0a24-5656-adbe-2db47702c289&skoid=3cb6de21-012a-49c9-9402-a1ebf8d0bd06&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-04T03%3A58%3A07Z&ske=2026-11-05T03%3A58%3A07Z&sks=b&skv=2026-02-06&sig=fPcbd6%2BXXgG7aiyXhBxRwSr7/K8URBz4HCaeZdijuA0%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$PACKAGE_URL" -o bundle.zip
          unzip -q bundle.zip -d unpack
          deb="$(find unpack -name '*.deb' -type f | head -n1)"
          test -f "$deb"
          echo "6811c0ca8e844b122a376de1f2062de03c1f33dd1e2af45d775f16e2696367c6  $deb" | sha256sum -c -
          test "$(dpkg-deb -f "$deb" Package)" = "com.fzj.autonetkeeper"
          test "$(dpkg-deb -f "$deb" Version)" = "0.4.3~beta1"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64e"
          mkdir -p dist
          cp "$deb" "dist/com.fzj.autonetkeeper_0.4.3-beta1_iphoneos-arm64e.deb"
          sha256sum dist/*.deb
      - name: Publish publicly accessible DEB
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="autonetkeeper-v0.4.3-roothide-download"
          gh release create "$tag" dist/*.deb --target "$GITHUB_SHA" \
            --title "AutoNetKeeper v0.4.3 RootHide: hotspot-only" \
            --notes "Restore v0.4.2 hotspot-only behavior. Do not switch from 17 Pro hotspot to normal Wi-Fi below -70dBm; require two consecutive detections. Hotspot scans about every 20s, extend WiFiKit directed scan retries. This is a genuine compiled binary from private Actions, not an untested repack. Real-device behavior must be verified."
          echo "Public link: https://github.com/$GH_REPO/releases/tag/$tag"
